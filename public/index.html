<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Feedback Board</h1>
      <p class="subtitle">Share your thoughts. Stored in a cloud-hosted SQLite database.</p>
    </header>

    <section class="stats">
      <div class="stat"><span id="total">0</span><small>Responses</small></div>
      <div class="stat"><span id="average">0</span><small>Average rating</small></div>
    </section>

    <form id="feedback-form" class="card">
      <label>Name
        <input type="text" id="name" maxlength="50" required />
      </label>

      <label>Rating
        <select id="rating" required>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Okay</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Terrible</option>
        </select>
      </label>

      <label>Message
        <textarea id="message" rows="4" maxlength="500" required></textarea>
      </label>

      <button type="submit">Submit feedback</button>
      <p id="status" role="status"></p>
    </form>

    <section>
      <h2>Recent feedback</h2>
      <div id="list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
